name: Reels

on:
  schedule:            # UTC; Tashkent is UTC+5
    - cron: '23 3 * * *'    # 08:23
    - cron: '47 7 * * *'    # 12:47
    - cron: '13 13 * * *'   # 18:13
    - cron: '37 16 * * *'   # 21:37
  workflow_dispatch:

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write

env:
  MARKETING_FEED_TOKEN: ${{ secrets.MARKETING_FEED_TOKEN }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ vars.IG_USER_ID }}
  IG_LOGIN: ${{ vars.IG_LOGIN || 'instagram' }}
  MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
  MEDIA_REPO: ${{ vars.MEDIA_REPO }}
  POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '4' }}

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Decide whether this slot is active
        id: slot
        run: |
          hour=$(date -u +%-H)
          case "$POSTS_PER_DAY" in
            2) active="7 16" ;;
            3) active="3 13 16" ;;
            *) active="3 7 13 16" ;;
          esac
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=true; fi
          for slot in $active; do if [ "$slot" = "$hour" ]; then run=true; fi; done
          if [ -z "$MARKETING_FEED_TOKEN" ]; then
            echo "::warning::MARKETING_FEED_TOKEN secret is not set; nothing to do."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.slot.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci
          pip install -q -r requirements.txt
          npx remotion browser ensure

      - name: Refresh statistics of earlier posts
        if: steps.slot.outputs.run == 'true' && env.IG_ACCESS_TOKEN != ''
        run: python -m pipeline.run metrics

      - name: Plan and render
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pipeline.run plan
          python -m pipeline.run render

      - name: Host the video for Instagram
        if: steps.slot.outputs.run == 'true' && env.MEDIA_REPO != '' && env.IG_ACCESS_TOKEN != ''
        env:
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${MEDIA_REPO_TOKEN}@github.com/${MEDIA_REPO}.git" media
          cp out/*.mp4 out/*.jpg media/
          cd media
          touch .nojekyll
          # Keep two weeks of files so the repository stays small.
          find . -maxdepth 1 \( -name '*.mp4' -o -name '*.jpg' \) -mtime +14 -delete
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Add $(ls ../out/*.mp4 | xargs -n1 basename)"
          git push -q

      - name: Publish
        if: steps.slot.outputs.run == 'true'
        run: python -m pipeline.run publish

      - name: Keep the video for review
        if: steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
            out/plan.json
          retention-days: 7

      - name: Record the post
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/posts.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Record post and statistics" && git push -q)
