name: Reels

on:
  schedule:
    # Hourly in name only: GitHub starts scheduled runs late and skips most of them
    # (three a day in practice), so each run checks what is due (see pipeline/due.py),
    # and the dispatcher session also starts a "stats" run before each creative session.
    - cron: '17 * * * *'
  # A new or released queue entry is posted right away.
  push:
    branches: ['claude/friendly-keller-nxybhq']
    paths: ['queue/*.json']
  workflow_dispatch:
    inputs:
      mode:
        description: "post: publish a video. check: test the Instagram connection without posting. stats: only refresh statistics."
        type: choice
        options: [post, check, stats]
        default: post

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write

env:
  MARKETING_FEED_TOKEN: ${{ secrets.MARKETING_FEED_TOKEN }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ vars.IG_USER_ID || secrets.IG_USER_ID }}
  IG_LOGIN: ${{ vars.IG_LOGIN || 'auto' }}
  # Rendered files are served from this repository's `media` branch.
  MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://raw.githubusercontent.com/{0}/media', github.repository) }}
  POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '2' }}
  MODE: ${{ inputs.mode || 'post' }}

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest commit on the branch, not the one the event was created for: an earlier
          # queued run may have recorded statistics or a post in the meantime.
          ref: ${{ github.ref_name }}

      - name: Refresh statistics
        if: env.IG_ACCESS_TOKEN != ''
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git pull -q --rebase
          python3 -m pipeline.stats || echo "::warning::statistics refresh failed"
          git add -A state
          # Statistics are refreshed again on the next run, so a lost race is dropped rather than failing the post.
          if ! git diff --cached --quiet; then
            git commit -q -m "Refresh statistics"
            if ! (git pull -q --rebase && git push -q); then
              git rebase --abort 2>/dev/null || true
              git fetch -q origin "${{ github.ref_name }}"
              git reset -q --hard FETCH_HEAD
              echo "::warning::statistics were not saved this time"
            fi
          fi

      - name: Diagnose the Instagram token
        if: env.MODE == 'check' && github.event_name == 'workflow_dispatch'
        run: |
          # Saved to the repository so the result can be read without opening the logs (it holds no secrets).
          python3 -m pipeline.stats diagnose 2>&1 | tee state/diagnosis.txt || true
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add state/diagnosis.txt
          git diff --cached --quiet || (git commit -q -m "Record token diagnosis" && git pull -q --rebase && git push -q)

      - name: Decide whether a post is due
        id: slot
        run: |
          run=$(python3 -m pipeline.due)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=true; fi
          if [ "$MODE" = "stats" ]; then run=false; fi
          # A push to the queue posts at once if something is ready and today's quota is not used up;
          # otherwise the entry waits for the next scheduled slot.
          if [ "${{ github.event_name }}" = "push" ]; then
            run=$(python3 -m pipeline.due arrival)
          fi
          if [ -z "$MARKETING_FEED_TOKEN" ]; then
            echo "::warning::MARKETING_FEED_TOKEN secret is not set; nothing to do."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "post due: $run"

      - uses: actions/setup-node@v4
        if: steps.slot.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.slot.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2
          npm ci
          pip install -q -r requirements.txt
          npx remotion browser ensure

      - name: Plan and render
        if: steps.slot.outputs.run == 'true'
        run: |
          python -m pipeline.run plan
          python -m pipeline.run render

      - name: Host the video for Instagram
        if: steps.slot.outputs.run == 'true' && env.IG_ACCESS_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir media && cd media
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin media; then git checkout -q FETCH_HEAD -- .; fi
          cp ../out/*.mp4 ../out/*.jpg .
          # File names start with the date, so sorting by name keeps the newest forty.
          ls *.mp4 | sort | head -n -40 | while read -r old; do rm -f "$old" "${old%.mp4}.jpg"; done
          # One commit, force-pushed: the branch never accumulates history.
          git checkout -q --orphan media
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Media files"
          git push -q -f origin media

      - name: Check the Instagram connection
        if: steps.slot.outputs.run == 'true' && env.MODE == 'check'
        run: python -m pipeline.run check

      - name: Publish
        if: steps.slot.outputs.run == 'true' && env.MODE == 'post'
        run: python -m pipeline.run publish

      - name: Keep the video for review
        if: always() && steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*.mp4
            out/*.jpg
            out/plan.json
          retention-days: 7

      - name: Record the post
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A state queue
          git diff --cached --quiet || (git commit -q -m "Record post and statistics" && git pull -q --rebase && git push -q)
